name: Documentation

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v6
      - uses: actions/configure-pages@v5
      - run: |
          Scripts/build-documentation.sh
          documentation_base_path="${GITHUB_REPOSITORY#*/}"
          xcrun docc process-archive transform-for-static-hosting \
            .build/SwiftDunk.doccarchive \
            --output-path .build/pages \
            --hosting-base-path "$documentation_base_path"
          printf '%s\n' \
            '<!doctype html>' \
            '<html lang="en">' \
            '<head>' \
            '  <meta charset="utf-8">' \
            '  <meta http-equiv="refresh" content="0; url=documentation/swiftdunk/">' \
            '  <title>SwiftDunk Documentation</title>' \
            '  <link rel="canonical" href="documentation/swiftdunk/">' \
            '</head>' \
            '<body>' \
            '  <p><a href="documentation/swiftdunk/">Open SwiftDunk documentation</a></p>' \
            '</body>' \
            '</html>' \
            > .build/pages/index.html
      - uses: actions/upload-pages-artifact@v4
        with:
          path: .build/pages

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
