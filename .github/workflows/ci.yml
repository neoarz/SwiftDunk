name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v6
      - run: swift build

  test:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v6
      - run: swift test --enable-code-coverage

  release:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v6
      - run: swift build --configuration release

  ios:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v6
      - run: >
          xcodebuild build
          -scheme SwiftDunk
          -destination 'generic/platform=iOS'
          CODE_SIGNING_ALLOWED=NO

  lint:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v6
      - run: |
          xcrun swift-format lint --strict --recursive Sources Tests Examples
          xcrun swift-format lint --strict Package.swift Scripts/MergeSymbolDocumentation.swift

  docs:
    if: github.event_name == 'pull_request'
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v6
      - run: Scripts/build-documentation.sh
